[package]
name = "rust-rdm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Tiny RDM rebuilt with Rust and GPUI"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui-component", "dep:gpui-component-assets"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1"
base64 = "0.22"
hex = "0.4"
flate2 = "1"
zstd = "0.13"
lz4_flex = "0.11"
brotli = "8"
rmp-serde = "1"
serde-pickle = "1"
quick-xml = "0.38"
native-tls = "0.2"
ssh2 = "0.9"
socks = "0.3"
url = "2"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
futures = "0.3"
ureq = { version = "3", features = ["json"] }
gpui = { version = "=0.2.2", features = ["runtime_shaders"], optional = true }
gpui-component = { version = "=0.5.1", optional = true }
gpui-component-assets = { version = "=0.5.1", optional = true }
rust-embed = "8"

[[bin]]
name = "rust-rdm"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
